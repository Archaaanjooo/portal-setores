<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- Ordem importa: primeiro os dados exportados, depois o emulador do claude.ai, depois o portal -->
<script src="js/dados-iniciais.js"></script>
<script src="js/claude-shim.js"></script>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Portal dos Setores</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra lateral recolhível (perfil, Conversas, tema) + coluna de setores + logo no canto + Claude flutuante no canto inferior. */
:root{
  --bg:#FCF7F8; --surface:#FFFFFF; --surface-2:#F4EFF3; --line:#E4DFE7; --fg:#27386D; --muted:#646E92;
  --accent:#27386D; --accent-fg:#FCF7F8; --accent-soft:#D9F7F7; --cyan:#2ED8D8; --cyan-ink:#1B2650; --accent-line:#27386D; --badge-line:transparent; --prop-line:color-mix(in srgb,#2ED8D8 60%,#E4DFE7); --link:#27386D; --tab-line:#2ED8D8; --side-bar:#27386D; --sbtn-bg:#FFFFFF; --map-share:#14A3A3; --map-ind:#27386D; --map-pess:#C2417A; --bot-bg:#FFFFFF; --bot-input:#FFFFFF; --bot-send:#27386D; --bot-send-line:#27386D; --bot-head:#27386D; --bot-head-line:#27386D; --bot-bar:#27386D; --bot-bar-line:#27386D;
  --side-bg:#FCF7F8; --side-fg:#27386D; --side-muted:#646E92; --side-hover:rgba(39,56,109,.07); --side-line:#E4DFE7;
  --side-cover:#27386D; --side-cover-fg:#FCF7F8; --side-cover-dot:rgba(252,247,248,.16); --side-accent:#27386D; --side-accent-fg:#FCF7F8;
  --warn:#8A5200; --warn-soft:#FFF0D4; --danger:#B3261E; --danger-soft:#FBE4E1; --ok:#17785A; --ok-soft:#DDF4EC;
  --t-txt:#27386D; --t-plan:#0E8686; --t-arq:#A0611A;
  --shadow:0 1px 2px rgba(39,56,109,.06),0 10px 30px rgba(39,56,109,.14);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#050710; --surface:#10132A; --surface-2:#171B36; --line:#252A4D; --fg:#FCF7F8; --muted:#9CA1C4;
  --accent:#0E103B; --accent-fg:#FCF7F8; --accent-soft:#191C52; --accent-line:#3B3F8C; --badge-line:#3B3F8C; --prop-line:#3B3F8C; --link:#FCF7F8; --tab-line:#FCF7F8; --cyan:#0E103B; --cyan-ink:#FCF7F8;
  --side-bg:#050710; --side-fg:#FCF7F8; --side-muted:#9CA1C4; --side-hover:rgba(252,247,248,.06); --side-line:#1D2140;
  --side-cover:#090B1A; --sbtn-bg:#090B1A; --map-share:#2ED8D8; --map-ind:#A9B4F0; --map-pess:#E88AB0; --bot-bg:#090B1A; --bot-head:#050710; --bot-head-line:#252A4D; --bot-bar:#050710; --bot-input:#050710; --bot-send:#050710; --bot-send-line:#3B3F8C; --bot-bar-line:#252A4D; --side-cover-fg:#FCF7F8; --side-cover-dot:rgba(252,247,248,.12); --side-accent:#0E103B; --side-accent-fg:#FCF7F8; --side-bar:#FCF7F8;
  --warn:#F2B95E; --warn-soft:#2E2716; --danger:#FF8C82; --danger-soft:#33161F; --ok:#5FE0B4; --ok-soft:#10302C;
  --t-txt:#A9BCF5; --t-plan:#D9DCFA; --t-arq:#E8A963;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#050710; --surface:#10132A; --surface-2:#171B36; --line:#252A4D; --fg:#FCF7F8; --muted:#9CA1C4;
  --accent:#0E103B; --accent-fg:#FCF7F8; --accent-soft:#191C52; --accent-line:#3B3F8C; --badge-line:#3B3F8C; --prop-line:#3B3F8C; --link:#FCF7F8; --tab-line:#FCF7F8; --cyan:#0E103B; --cyan-ink:#FCF7F8;
  --side-bg:#050710; --side-fg:#FCF7F8; --side-muted:#9CA1C4; --side-hover:rgba(252,247,248,.06); --side-line:#1D2140;
  --side-cover:#090B1A; --sbtn-bg:#090B1A; --map-share:#2ED8D8; --map-ind:#A9B4F0; --map-pess:#E88AB0; --bot-bg:#090B1A; --bot-head:#050710; --bot-head-line:#252A4D; --bot-bar:#050710; --bot-input:#050710; --bot-send:#050710; --bot-send-line:#3B3F8C; --bot-bar-line:#252A4D; --side-cover-fg:#FCF7F8; --side-cover-dot:rgba(252,247,248,.12); --side-accent:#0E103B; --side-accent-fg:#FCF7F8; --side-bar:#FCF7F8;
  --warn:#F2B95E; --warn-soft:#2E2716; --danger:#FF8C82; --danger-soft:#33161F; --ok:#5FE0B4; --ok-soft:#10302C;
  --t-txt:#A9BCF5; --t-plan:#D9DCFA; --t-arq:#E8A963;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.45); color-scheme:dark}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body)}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:28px;font-weight:700;letter-spacing:-.01em}
h2{font-size:19px;font-weight:600}
p{margin:0}
a{color:var(--link)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
svg{flex:none}
/* Estrutura */
.app{display:flex;min-height:100%}
#side{position:sticky;top:0;height:100vh;width:272px;flex:none;overflow:auto;background:var(--side-bg);color:var(--side-fg);border-right:1px solid var(--side-line);display:flex;flex-direction:column;padding-left:env(safe-area-inset-left,0px)}
#side{transition:margin-left .32s cubic-bezier(.22,.8,.24,1),visibility 0s}
.app.side-closed #side{margin-left:-273px;visibility:hidden;transition:margin-left .32s cubic-bezier(.22,.8,.24,1),visibility 0s .32s}
.hb.open{animation:fadeIn .25s ease both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#main{--gx:28px;flex:1;min-width:0;padding-block:0 112px;padding-left:max(var(--gx),env(safe-area-inset-left,0px));padding-right:max(var(--gx),env(safe-area-inset-right,0px))}
.topline{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:0 calc(-1 * var(--gx)) 20px;padding:16px var(--gx) 12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:var(--bg);border-bottom:1px solid transparent;transition:border-color .2s,box-shadow .2s}
.topline.stuck{border-bottom-color:var(--line);box-shadow:0 6px 18px -12px rgba(0,0,0,.25)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:26;background:var(--bg)}
.wrap{max-width:1080px;display:flex;flex-direction:column;gap:22px}
.hb{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:8px;border:1px solid transparent;background:none;cursor:pointer;color:inherit}
.hb:hover{background:var(--side-hover)}
.hb.open{border-color:var(--line);background:var(--surface);color:var(--fg)}
.hb.open:hover{background:var(--surface-2)}
.logo{border:0;background:none;padding:4px;border-radius:8px;cursor:pointer;line-height:0;transition:opacity .15s}
.logo:hover{opacity:.85}
.logo img{height:60px;width:auto;display:block}
.logo-d{display:none!important}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo-l{display:none!important}:root:not([data-theme="light"]) .logo-d{display:block!important}}
:root[data-theme="dark"] .logo-l{display:none!important}
:root[data-theme="dark"] .logo-d{display:block!important}
/* Barra lateral */
.cover{height:84px;background:var(--side-cover);position:relative;display:flex;justify-content:flex-end;align-items:flex-start;padding:8px;color:var(--side-cover-fg)}
.cover .hb:hover{background:color-mix(in srgb,var(--side-cover-fg) 14%,transparent)}
.perfil{position:relative;display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding:0 18px;margin-top:-30px}
.perfil .who{min-width:0;max-width:100%}
.perfil .nm{font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.perfil .em{color:var(--side-muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rl{color:var(--side-muted);font-size:12.5px;padding:2px 18px 0}
.av{width:26px;height:26px;border-radius:50%;flex:none;object-fit:cover;background:var(--surface-2);display:inline-block}
.av.sm{width:22px;height:22px}
.av.lg{width:60px;height:60px;border:3px solid var(--side-bg);background:var(--side-hover)}
.av.g{display:inline-grid;place-items:center;background:var(--cyan);color:var(--cyan-ink);font-weight:700;font-size:13px}
.nav{display:flex;flex-direction:column;gap:2px;padding:18px 10px 0}
.nav-i{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:9px 10px;cursor:pointer;color:var(--side-fg);font-weight:500}
.nav-i:hover{background:var(--side-hover)}
.nav-i.on{background:var(--side-hover);font-weight:600;box-shadow:inset 3px 0 0 var(--side-bar)}
#side .badge{background:var(--side-accent);color:var(--side-accent-fg)}
.nav-i span:first-of-type{flex:1}
.badge{border:1px solid var(--badge-line);min-width:20px;height:20px;border-radius:10px;background:var(--cyan);color:var(--cyan-ink);font-size:12px;font-weight:700;display:inline-grid;place-items:center;padding:0 6px}
.side-bottom{margin-top:auto;padding:10px 10px max(14px,env(safe-area-inset-bottom,0px));border-top:1px solid var(--side-line)}
#side :focus-visible{outline-color:var(--side-accent)}
/* Setores */
.setores{display:flex;flex-direction:column;gap:12px;max-width:360px}
.sbtn{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);background:var(--sbtn-bg);border-radius:var(--r);padding:14px 16px;cursor:pointer;text-align:left;font-family:var(--f-display);font-size:17px;font-weight:600;color:var(--fg);min-width:0}
.sbtn:hover{border-color:var(--link)}
.sbtn .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbtn .ct{font-family:var(--f-body);font-size:13px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.sbtn.add{justify-content:center;border-style:dashed;color:var(--link);padding:12px}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.tag-mine{font-family:var(--f-body);font-size:11px;background:var(--cyan);color:var(--cyan-ink);border-radius:4px;padding:0 6px;font-weight:700}
/* Componentes */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 13px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap;color:var(--fg)}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent-line);color:var(--accent-fg)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger)}
.btn.ghost{border-color:transparent;background:none}
.btn.icon{padding:7px 10px;letter-spacing:.05em}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:2px 9px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--link)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.head{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.head .sub{color:var(--muted);margin-top:6px;max-width:68ch}
.crumb{font-size:13.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.crumb button{background:none;border:0;color:var(--link);cursor:pointer;padding:0;font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.sec{display:flex;flex-direction:column;gap:12px}
.banner{border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14.5px}
.banner.warn{background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 9px;font-size:12.5px;font-weight:600;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.acc{background:var(--accent-soft);color:var(--fg)}
.meta-line{display:flex;gap:8px 16px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:14px}
.pp{display:inline-flex;gap:6px;align-items:center}
.linkish{background:none;border:0;padding:0;color:var(--link);cursor:pointer;font-weight:600;text-align:left}
.err{color:var(--danger)}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.lr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px;border:0;border-bottom:1px solid var(--line);cursor:pointer;background:none;text-align:left;width:100%;color:var(--fg)}
.lr:last-child{border-bottom:0}
.lr:hover{background:var(--surface-2)}
.lr .ttl{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lr .mt{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tp{font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.04em;border-radius:4px;padding:2px 6px;border:1px solid currentColor;white-space:nowrap}
.tp.texto{color:var(--t-txt)} .tp.planilha{color:var(--t-plan)} .tp.arquivo{color:var(--t-arq)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:16px;color:var(--muted);font-size:14px}
.people{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.person{display:inline-flex;gap:6px;align-items:center;background:var(--surface-2);border-radius:999px;padding:2px 10px 2px 2px;font-size:13.5px}
.person .x{border:0;background:none;cursor:pointer;color:var(--muted);padding:0 0 0 2px;font-size:15px;line-height:1}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;padding:8px 12px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--fg);border-bottom-color:var(--tab-line)}
textarea,input[type=text],select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%}
textarea:focus,input:focus,select:focus{outline:2px solid color-mix(in srgb,var(--link) 55%,transparent);outline-offset:0;border-color:var(--link)}
.editor{min-height:420px;font-family:var(--f-mono);font-size:14px;line-height:1.6;resize:vertical}
input.doc-title{font-family:var(--f-display);font-size:26px;font-weight:700;border:1px solid transparent;background:none;padding:2px 6px;margin-left:-6px;border-radius:6px}
input.doc-title:hover{border-color:var(--line)}
input.doc-title:focus{background:var(--surface)}
.prose{max-width:72ch;font-size:16px;line-height:1.65}
.prose h1{font-size:24px;margin:16px 0 8px} .prose h2{font-size:20px;margin:14px 0 6px} .prose h3{font-size:17px;margin:12px 0 4px}
.prose p{margin:0 0 10px} .prose ul,.prose ol{margin:0 0 10px;padding-left:22px}
.chip-ind{font-family:var(--f-mono);font-size:.92em;background:var(--accent-soft);color:var(--fg);border-radius:4px;padding:0 5px;white-space:nowrap}
.fx{display:flex;gap:8px;align-items:center;font-family:var(--f-mono);font-size:13.5px}
.fx .ref{min-width:54px;text-align:center;background:var(--surface-2);border-radius:6px;padding:7px 6px;font-weight:500}
.fx .lbl{color:var(--muted);font-style:italic}
.fx input{font-family:var(--f-mono);font-size:13.5px}
.sheet-wrap{overflow:auto;max-height:66vh;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.sheet{border-collapse:separate;border-spacing:0;font-family:var(--f-mono);font-size:13px}
table.sheet th{position:sticky;top:0;background:var(--surface-2);color:var(--muted);font-weight:500;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 0;min-width:120px;z-index:1}
table.sheet th.rh{position:sticky;left:0;min-width:42px;width:42px;z-index:2}
table.sheet td.rh{position:sticky;left:0;background:var(--surface-2);color:var(--muted);text-align:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0 6px;z-index:1}
table.sheet td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0}
input.cell{border:0;border-radius:0;background:transparent;width:120px;padding:5px 7px;font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
input.cell.num{text-align:right}
input.cell.err{color:var(--danger)}
input.cell.fml{background:color-mix(in srgb,var(--accent-soft) 50%,transparent)}
input.cell:focus{outline:2px solid var(--link);outline-offset:-2px;background:var(--surface);text-align:left}
.dirty{font-size:13px;color:var(--warn);font-weight:600}
#remoteBanner:empty{display:none}
.file-card{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.file-ico{width:56px;height:68px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--t-arq);background:var(--surface-2);text-transform:uppercase}
.preview img,.preview video{max-width:100%;border-radius:var(--r);border:1px solid var(--line)}
/* Conversas */
.conv{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px;align-items:start}
.conv-side{display:flex;flex-direction:column;gap:12px;min-width:0}
.conv-list{display:flex;flex-direction:column;gap:2px}
.conv-i{display:flex;gap:10px;align-items:center;border:0;background:none;border-radius:8px;padding:8px 10px;cursor:pointer;text-align:left;width:100%;color:var(--fg)}
.conv-i:hover{background:var(--surface-2)}
.conv-i.on{background:var(--accent-soft)}
.conv-i .ci{flex:1;min-width:0;display:flex;flex-direction:column}
.conv-i .cn{font-weight:600}
.conv-i .cp{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thread{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-height:420px;height:calc(100vh - 190px);min-width:0}
.thread>.empty{margin:16px}
.th-head{display:flex;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.back-m{display:none}
.msgs{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.dm{display:flex;gap:10px;align-items:flex-start;max-width:min(640px,100%)}
.dm-b{min-width:0}
.dm-h{display:flex;gap:8px;align-items:baseline;font-size:13.5px}
.dm-h span{color:var(--muted);font-size:12px}
.dm-t{white-space:pre-wrap;overflow-wrap:anywhere}
.dm.me .dm-t{background:var(--accent-soft);border-radius:8px;padding:6px 10px;margin-top:2px}
.dm-comp{display:flex;gap:8px;align-items:flex-end;padding:12px;border-top:1px solid var(--line)}
.dm-comp textarea{resize:none;min-height:40px;max-height:160px}
/* Claude flutuante */
#bot{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:35}
.bot-bar{display:flex;align-items:center;gap:14px;background:var(--bot-bar);color:var(--accent-fg);border:1px solid var(--bot-bar-line);border-radius:12px;padding:12px 14px 12px 18px;cursor:pointer;box-shadow:var(--shadow);font-family:var(--f-display);font-weight:700;font-size:17px}

const canWriteAny=()=>!!S.db&&!S.readOnly&&S.me.canWrite!==false;
const setorById=id=>S.setores.find(s=>s.id===id);
const docById=id=>S.docs.find(d=>d.id===id);
function canEditSetor(s){if(!canWriteAny()||!s)return false;if(S.me.isAdmin)return true;return!!S.me.id&&(s.responsavel===S.me.id||(s.editores||[]).includes(S.me.id))}
function canManageSetor(s){if(!canWriteAny()||!s)return false;return S.me.isAdmin||(!!S.me.id&&s.responsavel===S.me.id)}
function pastaRaiz(id){const path=pastaPath(id);return path[0]||null}
function alvosPasta(p){const r=p?pastaRaiz(p.id):null;if(!r||!r.compartilhada)return[];const c=r.compartilhadaCom||[];return(c.includes('*')?S.setores.map(x=>x.id):c).filter(x=>x!==r.setorId&&setorById(x))}
function pastaVisivelEm(p,setorId){if(!p)return false;return p.setorId===setorId||alvosPasta(p).includes(setorId)}
function canEditPasta(id){const p=pastaById(id);if(!p)return false;if(canEditSetor(setorById(p.setorId)))return true;return alvosPasta(p).some(x=>canEditSetor(setorById(x)))}
function canEditDoc(d){if(!d)return false;if(canEditSetor(setorById(d.setorId)))return true;return!!(d.pastaId&&pastaById(d.pastaId)&&canEditPasta(d.pastaId))}
function setoresDoDoc(d){const out=[d.setorId];if(d.pastaId&&pastaById(d.pastaId))out.push(...alvosPasta(pastaById(d.pastaId)));return out}
function papel(s){if(!s)return'';if(S.me.id&&s.responsavel===S.me.id)return'Responsável';if(S.me.id&&(s.editores||[]).includes(S.me.id))return'Editor';if(S.me.isAdmin)return'Administrador';return'Somente leitura'}

function pname(id){if(!id)return'Alguém';const p=S.names[id];if(p&&p.name)return p.name;return id===S.me.id?(S.me.name||'Você'):'Alguém'}
function fotoUrl(id){const pf=id&&S.perfis&&S.perfis[id];if(!pf)return'';const d=pf.fotoData;if(typeof d==='string'&&d.length<90000&&/^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(d))return d;const f=pf.foto;return f&&/^[0-9a-f]{32}$/.test(f)?'/_blob/'+f:''}
function pav(id,cls){const p=S.names[id];const src=fotoUrl(id)||(p?p.avatarUrl:(id===S.me.id?S.me.avatar:''));return src?`<img class="av ${cls||''}" src="${esc(src)}" alt="">`:`<span class="av ${cls||''}"></span>`}
let namesBusy=false;
function ensureNames(){if(!S.user||namesBusy)return;const ids=new Set();
  S.setores.forEach(s=>{if(s.responsavel)ids.add(s.responsavel);(s.editores||[]).forEach(x=>ids.add(x))});
  S.docs.forEach(d=>{if(d.atualizadoPor)ids.add(d.atualizadoPor);if(d.criadoPor)ids.add(d.criadoPor)});
  S.ativ.forEach(a=>a.userId&&ids.add(a.userId));(S.convs||[]).forEach(c=>(c.membros||[]).forEach(x=>ids.add(x)));(S.msgs||[]).forEach(m=>m.userId&&ids.add(m.userId));S.pedidos.forEach(p=>p.userId&&ids.add(p.userId));(S.avisos||[]).forEach(v=>v.userId&&ids.add(v.userId));S.ativ.forEach(a=>a.alvoUser&&ids.add(a.alvoUser));
  const list=[...ids];if(!list.length)return;namesBusy=true;
  S.user.profiles(list).then(ps=>{let ch=false;for(const k of Object.keys(ps)){const o=S.names[k],n=ps[k];if(!o||o.name!==n.name||o.avatarUrl!==n.avatarUrl){S.names[k]={name:n.name,avatarUrl:n.avatarUrl};ch=true}}namesBusy=false;if(ch)scheduleRender()}).catch(()=>{namesBusy=false})}

function mainBusy(){const a=document.activeElement;return!!a&&$('#main').contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)}
let raf=0;function scheduleRender(){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;render(false)})}
function render(force){applySide();renderSide();if(!force&&mainBusy()){S.pending=true;updateLive();return}S.pending=false;renderMain();ensureNames()}
document.addEventListener('focusout',()=>setTimeout(()=>{const w=document.querySelector('.search');if(w&&!w.contains(document.activeElement)){const r=$('#busRes');if(r)r.hidden=true}if(S.pending&&!mainBusy())render(false)},0));
document.addEventListener('focusin',e=>{if(e.target&&e.target.id==='busca')renderBusca()});
function updateLive(){if(S.route.v==='doc'){refreshDisplays();const b=$('#remoteBanner');if(b)b.innerHTML=remoteBannerHTML()}if(S.route.v==='conversas')updateConversas()}
const MQ=window.matchMedia('(max-width:640px)');const isMobile=()=>MQ.matches;
if(MQ.addEventListener)MQ.addEventListener('change',()=>render(true));
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}}
S.sideClosed=lsGet('portal.side')==='fechada';S.sideOpenMobile=false;S.theme=lsGet('portal.tema');S.botOpen=lsGet('portal.bot')==='aberto';
function sideHidden(){return isMobile()?!S.sideOpenMobile:S.sideClosed}
function applySide(){const app=$('#app');app.classList.toggle('side-closed',!isMobile()&&S.sideClosed);app.classList.toggle('side-open',isMobile()&&S.sideOpenMobile);$('#scrim').classList.toggle('on',isMobile()&&S.sideOpenMobile)}
function isDark(){const a=document.documentElement.getAttribute('data-theme');if(a)return a==='dark';return window.matchMedia('(prefers-color-scheme: dark)').matches}
function applyTheme(){if(S.theme)document.documentElement.setAttribute('data-theme',S.theme)}

/* ---- Mapa mental dos setores ---- */
function relacoesSetores(){const ids=new Set(S.setores.map(s=>s.id));const E={};
  const add=(a,b,t,det)=>{if(!a||!b||a===b||!ids.has(a)||!ids.has(b))return;const x=a<b?a:b,y=a<b?b:a,k=x+'|'+y;const e=E[k]||(E[k]={a:x,b:y,share:0,ind:0,pess:0,det:[]});e[t]++;if(det&&e.det.length<6&&!e.det.includes(det))e.det.push(det)};
  S.docs.forEach(d=>{const sh=d.compartilhadoCom||[];const alvo=sh.includes('*')?[...ids]:sh;alvo.forEach(x=>add(d.setorId,x,'share','“'+d.titulo+'” compartilhado'));
    const txt=d.tipo==='planilha'?Object.values((d.planilha||{}).celulas||{}).join(' '):d.tipo==='texto'?(d.texto||''):'';if(!txt)return;
    const nomes=new Set();txt.replace(/IND\(\s*"([^"]{1,80})"\s*\)/gi,(m,n)=>{nomes.add(norm(n));return m});txt.replace(/\{\{([^}]{1,80})\}\}/g,(m,n)=>{nomes.add(norm(n));return m});
    nomes.forEach(n=>{const i=S.inds.find(x=>norm(x.nome)===n);if(i)add(d.setorId,i.setorId,'ind','“'+d.titulo+'” usa o indicador '+i.nome)})});
  for(let i=0;i<S.setores.length;i++)for(let j=i+1;j<S.setores.length;j++){const A=S.setores[i],B=S.setores[j];const pa=new Set([A.responsavel,...(A.editores||[])].filter(Boolean));
    [B.responsavel,...(B.editores||[])].filter(Boolean).forEach(x=>{if(pa.has(x))add(A.id,B.id,'pess',pname(x)+' atua nos dois')})}
  return Object.values(E)}
function vMapa(){const n=S.setores.length;if(n<2)return'';
  const R=n>16?300:270,rn=n>20?13:n>12?18:24,PX=rn+150,PY=rn+56,W=2*(R+PX),H=2*(R+PY),CX=W/2,CY=H/2;const pos={};
  S.setores.forEach((s,i)=>{const a=-Math.PI/2+2*Math.PI*i/n;pos[s.id]={x:CX+R*Math.cos(a),y:CY+R*Math.sin(a),c:Math.cos(a),s:Math.sin(a)}});
  const rel=relacoesSetores();const curva=(p,q,k)=>{const mx=(p.x+q.x)/2,my=(p.y+q.y)/2;return`M${p.x.toFixed(1)},${p.y.toFixed(1)} Q${(CX+(mx-CX)*k).toFixed(1)},${(CY+(my-CY)*k).toFixed(1)} ${q.x.toFixed(1)},${q.y.toFixed(1)}`};
  let fracas='';for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){const A=S.setores[i],B=S.setores[j];fracas+=`<path class="mm-e fraca" data-a="${esc(A.id)}" data-b="${esc(B.id)}" d="${curva(pos[A.id],pos[B.id],.55)}"/>`}
  const fortes=rel.map(e=>{const tot=e.share+e.ind+e.pess;const tipo=e.ind>=e.share&&e.ind>=e.pess?'ind':e.share>=e.pess?'share':'pess';const A=setorById(e.a),B=setorById(e.b);
    const partes=[e.share?e.share+' compartilhamento'+(e.share>1?'s':''):'',e.ind?e.ind+' uso'+(e.ind>1?'s':'')+' de indicador':'',e.pess?e.pess+' pessoa'+(e.pess>1?'s':'')+' em comum':''].filter(Boolean).join(', ');
    return`<path class="mm-e forte t-${tipo}" data-a="${esc(e.a)}" data-b="${esc(e.b)}" stroke-width="${Math.min(2+tot*1.3,10).toFixed(1)}" d="${curva(pos[e.a],pos[e.b],.3)}"><title>${esc(A.nome)} ↔ ${esc(B.nome)}: ${esc(partes)}${e.det.length?'\n'+esc(e.det.join('\n')):''}</title></path>`}).join('');
  const raios=S.setores.map(s=>`<line class="mm-sp" data-a="${esc(s.id)}" data-b="" x1="${CX}" y1="${CY}" x2="${pos[s.id].x.toFixed(1)}" y2="${pos[s.id].y.toFixed(1)}"/>`).join('');
  const nos=S.setores.map(s=>{const p=pos[s.id];const cnt=S.docs.filter(d=>d.setorId===s.id).length;const r=rn+Math.min(cnt,12)*.7;
    const lr=R+r+14,lx=CX+lr*p.c,ly=CY+lr*p.s+(p.s>.35?12:p.s<-.35?-4:5);const anc=p.c>.3?'start':p.c<-.3?'end':'middle';const nome=s.nome.length>22?s.nome.slice(0,21)+'…':s.nome;
    const lig=rel.filter(e=>e.a===s.id||e.b===s.id).length;
    return`<g class="mm-n" data-node="${esc(s.id)}" data-act="go" data-v="setor" data-id="${esc(s.id)}" data-ctx-setor="${esc(s.id)}" tabindex="0" role="link" aria-label="${esc(s.nome)}: ${cnt} itens, ${lig} ligações"><title>${esc(s.nome)} · ${cnt} ${cnt===1?'item':'itens'} · ${lig} ${lig===1?'ligação':'ligações'}</title>
      <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${(r+5).toFixed(1)}" class="mm-halo"/><circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${r.toFixed(1)}" fill="${safeColor(s.cor)}" class="mm-c"/>
      <text x="${p.x.toFixed(1)}" y="${(p.y+5).toFixed(1)}" text-anchor="middle" class="mm-ct">${cnt}</text>
      <text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="${anc}" class="mm-l">${esc(nome)}</text></g>`}).join('');
  const total=rel.length;
  return`<section class="mapa ${S.mapaVisto?'mm-vis':''}" id="mapa" aria-label="Mapa dos setores"><div class="mm-wrap"><svg id="mm" class="mm" viewBox="0 0 ${W} ${H}" role="img" aria-label="Mapa circular que conecta todos os setores">
      <circle cx="${CX}" cy="${CY}" r="${R}" class="mm-orb"/>${raios}${fracas}${fortes}
      <g class="mm-centro"><circle cx="${CX}" cy="${CY}" r="56"/><text x="${CX}" y="${CY-4}" text-anchor="middle" class="mm-c1">${n} setores</text><text x="${CX}" y="${CY+18}" text-anchor="middle" class="mm-c2">${S.docs.length} itens</text></g>
      ${nos}</svg></div></section>`}
let mapaIO=null;
function observarMapa(){const el=$('#mapa');if(!el||S.mapaVisto)return;if(!('IntersectionObserver' in window)){document.documentElement.classList.add('no-io');S.mapaVisto=true;return}
  if(mapaIO)mapaIO.disconnect();mapaIO=new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting){S.mapaVisto=true;en.target.classList.add('mm-vis');mapaIO.disconnect()}})},{threshold:.15});mapaIO.observe(el)}

  const viz=new Set([id]);svg.querySelectorAll('.mm-e.forte').forEach(p=>{if(p.dataset.a===id)viz.add(p.dataset.b);if(p.dataset.b===id)viz.add(p.dataset.a)});

let fixDrag=null;

function iniciarArrasto(){if(!fixDrag)return;fixDrag.ativo=true;S.dragFix=true;fixDrag.it.classList.add('arrastando');fixDrag.it.parentElement.classList.add('ordenando');document.body.classList.add('no-sel')}
function terminarArrasto(salvar){if(!fixDrag)return;clearTimeout(fixDrag.t);const f=fixDrag;fixDrag=null;if(!f.ativo)return;
  const box=f.it.parentElement;const ids=[...box.children].map(x=>x.dataset.id).filter(Boolean);f.it.classList.remove('arrastando');box.classList.remove('ordenando');document.body.classList.remove('no-sel');S.dragFix=false;
  S.supressClick=true;setTimeout(()=>{S.supressClick=false},80);if(salvar&&ids.join()!==(S.prefs.fixados||[]).join())salvarPrefs({fixados:ids});else renderSide()}
document.addEventListener('pointerdown',e=>{const it=e.target.closest&&e.target.closest('.fixados .nav-i');if(!it||e.button>0)return;
  fixDrag={it,x:e.clientX,y:e.clientY,ativo:false,touch:e.pointerType!=='mouse',t:null};if(fixDrag.touch)fixDrag.t=setTimeout(iniciarArrasto,280)});
document.addEventListener('pointermove',e=>{if(!fixDrag)return;
  if(!fixDrag.ativo){const d=Math.hypot(e.clientX-fixDrag.x,e.clientY-fixDrag.y);if(fixDrag.touch){if(d>8){clearTimeout(fixDrag.t);fixDrag=null}return}if(d>5)iniciarArrasto();else return}
  e.preventDefault();const box=fixDrag.it.parentElement;let antes=null;for(const x of box.children){if(x===fixDrag.it)continue;const r=x.getBoundingClientRect();if(e.clientY<r.top+r.height/2){antes=x;break}}
  if(antes!==fixDrag.it.nextSibling)box.insertBefore(fixDrag.it,antes)},{passive:false});

/* ---- SharePoint (conector Microsoft 365, somente leitura) ---- */
const MS='Microsoft 365';
function spTextos(r){return((r&&r.content)||[]).filter(b=>b&&b.type==='text'&&typeof b.text==='string').map(b=>b.text)}
function spItens(r){const out=[];const push=o=>{if(o&&typeof o==='object'&&typeof o.uri==='string'&&o.name)out.push(o)};
  for(const t of spTextos(r)){let v=null;try{v=JSON.parse(t)}catch(e){}
    if(Array.isArray(v))v.forEach(push);else if(v)push(v);else t.split(/\n+/).forEach(l=>{try{push(JSON.parse(l))}catch(e){}})}
  if(!out.length&&r&&r.payload){const p=r.payload;if(Array.isArray(p))p.forEach(push);else push(p)}
  return out}
function spListagem(r){const txt=spTextos(r).join('\n');const re=/(.+?) \((folder|file), (\d+) bytes\) (file:\/\/\/\S+?\/[A-Z0-9]{34})/g;const out=[];let m;
  while((m=re.exec(txt)))out.push({nome:m[1].trim(),tipo:m[2],tamanho:+m[3],uri:m[4]});return out}
function spLimpa(t){return String(t||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim()}
function spWebOk(u){return typeof u==='string'&&/^https:\/\/[a-z0-9-]+(\.[a-z0-9-]+)*\.sharepoint\.com\//i.test(u)}
function spCaminho(u){try{const p=decodeURIComponent(new URL(u).pathname).split('/').filter(Boolean);const i=p.indexOf('Documents');const r=(i>=0?p.slice(i+1):p.slice(-3));return r.filter(x=>x!=='Forms'&&!/\.aspx$/i.test(x)).slice(-3,-1).join(' / ')}catch(e){return''}}
function spErro(e){const c=e&&e.code;
  if(c==='server_not_connected'||c==='server_not_found')return'Conecte o Microsoft 365 no claude.ai (Configurações → Conectores) para ver o SharePoint aqui.';
  if(c==='needs_reauth')return'Sua conexão com o Microsoft 365 expirou. Reconecte em claude.ai → Configurações → Conectores.';
  if(c==='not_in_manifest'||c==='approval_required'||c==='consent_required')return'O portal ainda não tem sua autorização para usar o Microsoft 365. Clique em Tentar de novo e permita o acesso.';
  if(c==='blocked_by_policy')return'A organização bloqueou este acesso ao SharePoint.';
  if(c==='selection_required')return'Escolha qual conexão do Microsoft 365 usar no aviso do claude.ai.';
  if(c==='tool_error')return'O SharePoint não encontrou esse item ou você não tem acesso a ele.';
  if(c==='not_granted'||c==='capability_disabled'||c==='capability_removed')return'O SharePoint não está disponível nesta visualização. Abra o portal no claude.ai.';
  return'Não foi possível falar com o SharePoint agora. Tente de novo em instantes.'}
function spCall(tool,input,fresh){if(!S.mcp)return Promise.reject({code:'not_granted'});return S.mcp.callTool(MS,tool,input,{cache:fresh?{staleTime:0,gcTime:300000,refresh:true}:{staleTime:60000,gcTime:300000}})}
S.sp={};
function spEstado(id){return S.sp[id]||(S.sp[id]={pilha:[],itens:null,erro:null,carregando:false,uri:null})}
function vSharePoint(s){if(!s||!s.sp||S.route.pasta)return'';const st=spEstado(s.id);if(!st.pilha.length||st.pilha[0].uri!==s.sp.uri)st.pilha=[{uri:s.sp.uri,nome:s.sp.nome}];
  const topo=st.pilha[st.pilha.length-1];
  const crumbs=st.pilha.map((p,i)=>i===st.pilha.length-1?`<span>${esc(p.nome)}</span>`:`<button class="linkish" data-act="spVolta" data-i="${i}">${esc(p.nome)}</button>`).join(' / ');
  let corpo='';
  if(!S.mcp)corpo=`<div class="empty">${esc(spErro({code:'not_granted'}))}</div>`;
  else if(st.erro)corpo=`<div class="banner warn"><div style="flex:1;min-width:200px">${esc(spErro(st.erro))}</div><button class="btn" data-act="spRecarregar">Tentar de novo</button></div>`;
  else if(!st.itens)corpo='<div class="empty">Carregando arquivos do SharePoint...</div>';
  else if(!st.itens.length)corpo='<div class="empty">Esta pasta do SharePoint está vazia.</div>';
  else corpo=`<div class="list">${st.itens.map(it=>{const ext=(it.nome.split('.').pop()||'').slice(0,4).toUpperCase();
    return it.tipo==='folder'?`<button class="lr" data-act="spAbrir" data-uri="${esc(it.uri)}" data-nome="${esc(it.nome)}"><span class="fold-ic sp">${IC.folder}</span><span style="min-width:0"><div class="ttl">${esc(it.nome)}</div><div class="mt">Pasta · ${fmtBytes(it.tamanho)}</div></span><span></span></button>`
      :`<button class="lr" data-act="spArquivo" data-uri="${esc(it.uri)}" data-nome="${esc(it.nome)}"><span class="tp sp">${esc(ext||'ARQ')}</span><span style="min-width:0"><div class="ttl">${esc(it.nome)}</div><div class="mt">${fmtBytes(it.tamanho)}</div></span><span></span></button>`}).join('')}</div>`;
  return`<section class="sec" id="spSec"><div class="sp-h">${IC.cloud}<h2>SharePoint</h2><span class="muted small sp-crumb">${crumbs}</span><span class="spacer"></span>
    ${st.pilha.length===1&&spWebOk(s.sp.webUrl)?`<a class="btn" href="${esc(s.sp.webUrl)}" target="_blank" rel="noopener">Abrir no SharePoint</a>`:''}${S.mcp?`<button class="btn icon" data-act="spRecarregar" aria-label="Atualizar lista do SharePoint" title="Atualizar">${IC.refresh}</button>`:''}</div>${corpo}</section>`}
function atualizarSP(){const el=$('#spSec');const s=setorById(S.route.id);if(el&&s&&S.route.v==='setor'){const h=vSharePoint(s);if(h)el.outerHTML=h}}
async function carregarSP(force){if(S.route.v!=='setor'||S.route.pasta)return;const s=setorById(S.route.id);if(!s||!s.sp||!S.mcp)return;const st=spEstado(s.id);
  if(!st.pilha.length||st.pilha[0].uri!==s.sp.uri)st.pilha=[{uri:s.sp.uri,nome:s.sp.nome}];const topo=st.pilha[st.pilha.length-1];
  if(!force&&(st.carregando&&st.uri===topo.uri||st.uri===topo.uri&&(st.itens||st.erro)))return;
  st.carregando=true;st.erro=null;if(st.uri!==topo.uri)st.itens=null;st.uri=topo.uri;atualizarSP();
  try{const r=await spCall('read_resource',{uri:topo.uri},force);if(st.uri!==topo.uri)return;st.itens=spListagem(r).sort((a,b)=>a.tipo===b.tipo?a.nome.localeCompare(b.nome,'pt-BR'):a.tipo==='folder'?-1:1)}
  catch(e){if(st.uri===topo.uri)st.erro=e}finally{if(st.uri===topo.uri){st.carregando=false;atualizarSP()}}}
async function abrirSpArquivo(uri,nome,webUrl){openModal('spArq',{uri,nome,webUrl:spWebOk(webUrl)?webUrl:null,carregando:true});
  const same=()=>S.modal&&S.modal.type==='spArq'&&S.modal.data.uri===uri;
  spCall('read_resource',{uri,startPage:1,endPage:3}).then(r=>{if(!same())return;const img=(r.content||[]).find(b=>b.type==='image'&&b.data&&/^image\/(png|jpeg|gif|webp)$/.test(b.mimeType||''));
      S.modal.data.texto=spTextos(r).join('\n').slice(0,8000);if(img)S.modal.data.img='data:'+img.mimeType+';base64,'+img.data;S.modal.data.carregando=false;renderModal()})
    .catch(e=>{if(!same())return;S.modal.data.erro=e;S.modal.data.carregando=false;renderModal()});
  if(!S.modal.data.webUrl){const id=uri.split('/').pop();spCall('sharepoint_search',{query:nome.replace(/\.[^.]+$/,'').slice(0,120)||nome,limit:10}).then(r=>{if(!same())return;const hit=spItens(r).find(x=>x.id===id||x.uri===uri);if(hit&&spWebOk(hit.webUrl)){S.modal.data.webUrl=hit.webUrl;renderModal()}}).catch(()=>{})}}
let spBuscaT=0,spBuscaSeq=0;
function agendarSpBusca(){clearTimeout(spBuscaT);const q=(S.q||'').trim();if(!S.mcp||q.length<3){S.spBusca=null;return}
  if(S.spBusca&&S.spBusca.q===q)return;S.spBusca={q,carregando:true,itens:[]};
  spBuscaT=setTimeout(async()=>{const seq=++spBuscaSeq;try{const r=await spCall('sharepoint_search',{query:q,limit:6});if(seq!==spBuscaSeq||(S.q||'').trim()!==q)return;S.spBusca={q,itens:spItens(r)}}
    catch(e){if(seq!==spBuscaSeq)return;S.spBusca={q,itens:[],erro:e}}renderBusca()},550)}

/* ---- Pastas ---- */
function chkSetores(dono,selArr){const sel=new Set(selArr||[]);return`<div class="checks"><label><input type="checkbox" data-act="m-chk" value="*" ${sel.has('*')?'checked':''}> <b>Todos os setores</b></label>${S.setores.filter(x=>x.id!==dono).map(x=>`<label><input type="checkbox" data-act="m-chk" value="${esc(x.id)}" ${sel.has(x.id)?'checked':''} ${sel.has('*')?'disabled':''}><span class="dot" style="background:${safeColor(x.cor)}"></span>${esc(x.nome)}</label>`).join('')}</div>`}
const pastaById=id=>(S.pastas||[]).find(p=>p.id===id);
function pastaPath(id){const out=[];let p=pastaById(id),g=0;while(p&&g++<30){out.unshift(p);p=p.paiId?pastaById(p.paiId):null}return out}
function pastaNomeCompleto(id){return pastaPath(id).map(p=>p.nome).join(' / ')}
function subpastas(setorId,paiId){return(S.pastas||[]).filter(p=>p.setorId===setorId&&(p.paiId||null)===(paiId||null)).sort((a,b)=>String(a.nome).localeCompare(String(b.nome),'pt-BR'))}
function pastaDescendentes(id){const out=[id];(S.pastas||[]).filter(p=>p.paiId===id).forEach(p=>out.push(...pastaDescendentes(p.id)));return out}
function contarPasta(id){const ids=new Set(pastaDescendentes(id));return S.docs.filter(d=>ids.has(d.pastaId)).length+ids.size-1}
function crumbSetor(s,pastaId){const path=pastaId?pastaPath(pastaId):[];
  return`<div class="crumb"><button data-act="go" data-v="inicio">← Setores</button>${path.length?` / <button data-act="go" data-v="setor" data-id="${esc(s.id)}">${esc(s.nome)}</button>`+path.map((p,i)=>i===path.length-1?` / <span>${esc(p.nome)}</span>`:` / <button data-act="go" data-v="setor" data-id="${esc(s.id)}" data-pasta="${esc(p.id)}">${esc(p.nome)}</button>`).join(''):''}</div>`}
function vSetor(id){const s=setorById(id);if(!s)return`<div class="empty">${S.loaded.setores?'Este setor não existe mais.':'Carregando...'}</div>`;
  let cur=S.route.pasta||null;if(cur&&!pastaVisivelEm(pastaById(cur),id))cur=null;const pasta=cur?pastaById(cur):null;
  const man=canManageSetor(s),canSetor=canEditSetor(s),can=cur?canEditPasta(cur):canSetor;
  const docs=(cur?S.docs.filter(d=>d.pastaId===cur):S.docs.filter(d=>d.setorId===id&&!pastaById(d.pastaId))).sort((a,b)=>(b.atualizadoEm||'').localeCompare(a.atualizadoEm||''));
  const ordem=(a,b)=>String(a.nome).localeCompare(String(b.nome),'pt-BR');
  const subs=cur?(S.pastas||[]).filter(p=>p.paiId===cur).sort(ordem):[...subpastas(id,null),...(S.pastas||[]).filter(p=>!p.paiId&&p.setorId!==id&&pastaVisivelEm(p,id)).sort(ordem)];
  const rec=S.docs.filter(d=>d.setorId!==id&&((d.compartilhadoCom||[]).includes(id)||(d.compartilhadoCom||[]).includes('*')));
  const resp=s.responsavel?`<span class="pp">${pav(s.responsavel,'sm')}${esc(pname(s.responsavel))} <span class="muted">· responsável${pcargo(s.responsavel)?' · '+esc(pcargo(s.responsavel)):''}</span></span>`:'<span class="pill warn">Sem responsável</span>';
  const eds=(s.editores||[]).map(e=>`<span class="pp">${pav(e,'sm')}${esc(pname(e))}</span>`).join('');
  const rz=cur?pastaRaiz(cur):null;const outros=rz&&rz.compartilhada?[rz.setorId,...alvosPasta(rz)].filter(x=>x!==id).map(setorById).filter(Boolean):[];
  let h=`<div class="head"><div style="min-width:0">${crumbSetor(s,cur)}
    <h1 class="row h-setores" style="gap:12px"><span class="pp"><span class="dot" style="width:14px;height:14px;border-radius:4px;background:${safeColor(s.cor)}"></span>${esc(s.nome)}</span></h1>${outros.length?`<div class="h-outros" aria-label="Outros setores com esta pasta">${outros.map(o=>`<button class="h-outro" data-act="go" data-v="setor" data-id="${esc(o.id)}" data-pasta="${esc(cur)}" title="Abrir esta pasta em ${esc(o.nome)}"><span class="dot" style="background:${safeColor(o.cor)}"></span>${esc(o.nome)}</button>`).join('')}</div>`:''}
    ${s.descricao&&!cur?`<p class="sub">${esc(s.descricao)}</p>`:''}
    ${cur?'':`<div class="meta-line">${resp}${eds}<span class="pill ${canSetor?'ok':''}">${esc(papel(s))}</span></div>`}</div>
    <div class="row">${S.me.id&&S.db&&!cur?`<button class="btn ${isFixado(id)?'on':''}" data-act="fixar" data-id="${esc(id)}" aria-pressed="${isFixado(id)}">${IC.pin}${isFixado(id)?'Fixado':'Fixar'}</button>`:''}${man&&!cur?`<button class="btn" data-act="cfgSetor" data-id="${esc(id)}">Configurações</button>`:''}${can?`<button class="btn pri" data-act="menuNovo" data-id="${esc(id)}" aria-haspopup="menu">+ Novo</button>`:''}</div></div>`;
  if(pasta){const raiz=pastaRaiz(cur);const comp=raiz&&raiz.compartilhada;const dono=setorById(pasta.setorId);const alvos=comp?alvosPasta(pasta).map(x=>(setorById(x)||{}).nome).filter(Boolean):[];
    const temMenu=canEditSetor(dono);
    h+=`<div class="pasta-h ${comp?'comp':''}">${comp?IC.folderShare:IC.folder}<h2>${esc(pasta.nome)}</h2><span class="muted small">${contarPasta(cur)} ${contarPasta(cur)===1?'item':'itens'}</span><span class="spacer"></span>${temMenu?`<button class="btn icon" data-act="menuPasta" data-id="${esc(cur)}" aria-label="Ações da pasta" aria-haspopup="menu">•••</button>`:''}</div>
    ${comp?`<div class="banner info comp-info"><div>${IC.folderShare}<span><b>Pasta compartilhada</b> de ${esc(dono?dono.nome:'')}${alvos.length?' com '+esc(alvos.join(', ')):''}. Tudo o que é criado ou editado aqui aparece igual em todos esses setores.</span></div></div>`:''}`}
  const rows=subs.map(p=>{const n=contarPasta(p.id);const comp=!p.paiId&&p.compartilhada;const dono=setorById(p.setorId);const de=p.setorId!==id&&!cur;
    return`<button class="lr" data-act="go" data-v="setor" data-id="${esc(id)}" data-pasta="${esc(p.id)}"><span class="fold-ic ${comp?'comp':''}">${comp?IC.folderShare:IC.folder}</span><span style="min-width:0"><div class="ttl">${esc(p.nome)}</div><div class="mt">${n} ${n===1?'item':'itens'}${de&&dono?' · de '+esc(dono.nome):''}</div></span>${comp?'<span class="pill acc">compartilhada</span>':'<span></span>'}</button>`}).join('')+docs.map(d=>docRow(d,false)).join('');
  h+=`<section class="sec">${rows?`<div class="list">${rows}</div>`:`<div class="empty">${cur?'Esta pasta está vazia.':'Nenhum item ainda.'}</div>`}</section>`;
  if(rec.length&&!cur)h+=`<section class="sec"><h2>Recebidos de outros setores</h2><div class="list">${rec.map(d=>docRow(d,true)).join('')}</div></section>`;
  if(!cur)h+=vSharePoint(s);
  return h}

function opcoesPastas(setorId,excluir){const ex=excluir?new Set(pastaDescendentes(excluir)):new Set();const out=[];
  const walk=(pai,nivel)=>subpastas(setorId,pai).forEach(p=>{if(ex.has(p.id))return;out.push([p.id,'  '.repeat(nivel)+p.nome]);walk(p.id,nivel+1)});walk(null,0);return out}


/* ---- Documento ---- */
function loadDraft(d,modo){S.edit={docId:d.id,base:d.atualizadoEm,dirty:false,remote:false,modo:modo||(S.edit&&S.edit.docId===d.id?S.edit.modo:null),
  texto:d.texto||'',planilha:d.tipo==='planilha'?clone(d.planilha||{colunas:6,linhas:15,celulas:{}}):null};if(S.edit.planilha&&!S.edit.planilha.celulas)S.edit.planilha.celulas={};resetCalc()}
function remoteBannerHTML(){const e=S.edit;if(!e||!e.remote)return'';const d=docById(e.docId);
  return`<div class="banner warn"><div style="flex:1;min-width:220px"><b>${esc(pname(d&&d.atualizadoPor))}</b> salvou uma versão mais nova enquanto você editava.</div><button class="btn" data-act="pegarRemota">Usar a nova</button><button class="btn" data-act="salvar">Manter a minha</button></div>`}
function vDoc(id){const d=docById(id);if(!d)return`<div class="empty">${S.justCreated===id||!S.loaded.docs?'Abrindo...':'Este item foi excluído.'} <button class="linkish" data-act="go" data-v="inicio">Voltar</button></div>`;
  if(!S.edit||S.edit.docId!==id)loadDraft(d);

  if(!e.modo)e.modo=d.tipo==='texto'&&can&&!(d.texto||'').trim()?'editar':'ver';

    <div class="head"><div style="min-width:0;flex:1">${can?`<input type="text" id="docTitle" class="doc-title" value="${esc(d.titulo)}" aria-label="Título" title="Clique para renomear">`:`<h1>${esc(d.titulo)}</h1>`}
    <p class="muted small" style="margin-top:4px">${esc(pname(d.atualizadoPor))}, ${rel(d.atualizadoEm)}${shTxt?' · compartilhado com '+esc(shTxt):''}${can?'':' · somente leitura'}</p></div>
    <div class="row">${can&&d.tipo!=='arquivo'?`<span class="dirty" id="dirtyFlag">${e.dirty?'Não salvo':''}</span>`:''}
    ${can?`<button class="btn" data-act="compartilhar" data-id="${esc(id)}">Compartilhar</button>`:''}
    ${d.tipo==='arquivo'?'<button class="btn pri" data-act="baixarArq">Baixar</button>':''}
    ${can&&d.tipo!=='arquivo'?`<button class="btn pri" data-act="salvar" id="btnSalvar" ${e.dirty?'':'disabled'}>Salvar</button>`:''}
    ${d.tipo!=='arquivo'||can?`<button class="btn icon" data-act="menuDoc" data-id="${esc(id)}" aria-label="Mais ações" aria-haspopup="menu">•••</button>`:''}</div></div></div>
    <div id="remoteBanner">${remoteBannerHTML()}</div>`;
  if(d.tipo==='texto')h+=vTexto(d,can);else if(d.tipo==='planilha')h+=vPlanilha(d,can);else h+=vArquivo(d);
  return h}
function vTexto(d,can){const e=S.edit;let h=can?`<div class="tabs"><button class="tab ${e.modo==='ver'?'on':''}" data-act="modo" data-m="ver">Visualizar</button><button class="tab ${e.modo==='editar'?'on':''}" data-act="modo" data-m="editar">Editar</button></div>`:'';
  if(e.modo==='editar'&&can)h+=`<textarea id="txt" class="editor" placeholder="# Título&#10;## Subtítulo&#10;- item de lista&#10;**negrito**&#10;{{Nome do indicador}} mostra um número ao vivo">${esc(e.texto)}</textarea>`;

function vPlanilha(d,can){const p=S.edit.planilha;const cols=Math.min(p.colunas||6,26),rows=p.linhas||15;
  let h=`<div class="fx"><span class="ref" id="fxRef">${S.sel||'—'}</span><span class="lbl">fx</span><input type="text" id="fx" placeholder="Valor ou fórmula, ex.: =SOMA(B2:B10)" ${can?'':'readonly'} value="${esc(S.sel?(p.celulas[S.sel]??''):'')}">${can?`<button class="mini" data-act="pubInd" id="btnPubInd" title="Publicar a célula selecionada como indicador" ${S.sel?'':'disabled'}>Publicar ${S.sel||'célula'}</button>`:''}</div>
  <div class="sheet-wrap"><table class="sheet"><thead><tr><th class="rh"></th>${Array.from({length:cols},(_,c)=>`<th>${colL(c)}</th>`).join('')}</tr></thead><tbody>`;
  for(let r=0;r<rows;r++){h+=`<tr><td class="rh">${r+1}</td>`;for(let c=0;c<cols;c++){const ref=refStr(c,r);h+=`<td><input class="cell" data-ref="${ref}" aria-label="Célula ${ref}" ${can?'':'readonly'}></td>`}h+='</tr>'}
  h+=`</tbody></table></div>`;
  return h}
function refreshDisplays(){const e=S.edit;if(!e||!e.planilha)return;const a=document.activeElement;
  document.querySelectorAll('input.cell').forEach(inp=>{if(inp===a)return;const ref=inp.dataset.ref;const raw=e.planilha.celulas[ref];
    if(raw==null||raw===''){inp.value='';inp.className='cell';return}const v=displayCell(e.docId,ref);inp.value=v.txt;inp.className='cell'+(v.num?' num':'')+(v.err?' err':'')+(String(raw).startsWith('=')?' fml':'');inp.title=String(raw).startsWith('=')?String(raw):''})}
function vArquivo(d){const a=d.arquivo||{};const ext=(a.nome||'').split('.').pop().toLowerCase();const url='/_blob/'+encodeURIComponent(a.assetId||'');
  let prev='';if(!a.envelope&&/^image\//.test(a.mime||''))prev=`<div class="preview"><img src="${esc(url)}" alt="${esc(a.nome)}"></div>`;
  else if(!a.envelope&&/^video\//.test(a.mime||''))prev=`<div class="preview"><video controls src="${esc(url)}"></video></div>`;

function closePop(){const p=$('#pop');if(p)p.remove()}
function popMenu(btn,items,key,pt){const open=$('#pop');if(open&&open.dataset.key===key){closePop();return}closePop();
  while(items[0]==='-')items.shift();if(!items.length)return;
  const m=document.createElement('div');m.id='pop';m.className='pop';m.dataset.key=key;m.setAttribute('role','menu');
  m.innerHTML=items.map(it=>it==='-'?'<hr>':`<button role="menuitem" class="${it.danger?'danger':''}" data-act="${it.act}" ${Object.entries(it.data||{}).map(([k,v])=>`data-${k}="${esc(v)}"`).join(' ')}>${esc(it.label)}</button>`).join('');
  document.body.append(m);const r=btn.getBoundingClientRect();const w=m.offsetWidth,hh=m.offsetHeight;
  let left=Math.max(16,Math.min(r.right-w,innerWidth-w-16));let top=r.bottom+4;if(top+hh>innerHeight-8)top=Math.max(8,r.top-hh-4);
  if(pt){left=Math.max(8,Math.min(pt.x,innerWidth-w-8));top=pt.y+hh>innerHeight-8?Math.max(8,pt.y-hh):pt.y}
  m.style.left=left+'px';m.style.top=top+'px';const f=m.querySelector('button');if(f)f.focus({preventScroll:true})}

/* Markdown simples e seguro */
function inl(s){return s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[\s(])_(.+?)_(?=[\s).,;:!?]|$)/g,'$1<i>$2</i>').replace(/\{\{([^}]{1,80})\}\}/g,(m,n)=>{const nm=n.replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&lt;/g,'<').replace(/&gt;/g,'>');const i=S.inds.find(x=>norm(x.nome)===norm(nm));if(!i)return`<span class="chip-ind err" title="Indicador não encontrado">${n}?</span>`;const v=indDisplay(i);return`<span class="chip-ind" title="Indicador ao vivo: ${esc(i.nome)}">${esc(v.txt)}${i.unidade?' '+esc(i.unidade):''}</span>`})}
function md(src){const lines=esc(src).split('\n');let h='',list=null,para=[];
  const flushP=()=>{if(para.length){h+='<p>'+inl(para.join('<br>'))+'</p>';para=[]}};const flushL=()=>{if(list){h+=`<${list.t}>${list.items.map(x=>'<li>'+inl(x)+'</li>').join('')}</${list.t}>`;list=null}};
  for(const ln of lines){let m;
    if(m=/^(#{1,3})\s+(.*)$/.exec(ln)){flushP();flushL();const n=m[1].length;h+=`<h${n}>${inl(m[2])}</h${n}>`}
    else if(m=/^\s*[-*]\s+(.*)$/.exec(ln)){flushP();if(!list||list.t!=='ul'){flushL();list={t:'ul',items:[]}}list.items.push(m[1])}
    else if(m=/^\s*\d+[.)]\s+(.*)$/.exec(ln)){flushP();if(!list||list.t!=='ol'){flushL();list={t:'ol',items:[]}}list.items.push(m[1])}
    else if(!ln.trim()){flushP();flushL()}
    else{flushL();para.push(ln)}}
  flushP();flushL();return h}

/* ---- Busca geral ---- */
const fold=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function snippet(txt,terms){const t=String(txt||'').replace(/\s+/g,' ');const f=fold(t);let i=-1;for(const x of terms){const k=f.indexOf(x);if(k>=0&&(i<0||k<i))i=k}if(i<0)return'';
  const a=Math.max(0,i-40),b=Math.min(t.length,i+90);return(a>0?'…':'')+t.slice(a,b)+(b<t.length?'…':'')}
function marcar(txt,terms){let h=esc(txt);for(const x of terms){if(!x)continue;const f=fold(h);let out='',p=0,k;while((k=f.indexOf(x,p))>=0){out+=h.slice(p,k)+'<mark>'+h.slice(k,k+x.length)+'</mark>';p=k+x.length}h=out+h.slice(p)}return h}
function buscar(q){const terms=fold(q).trim().split(/\s+/).filter(Boolean);if(!terms.length||fold(q).trim().length<2)return null;const has=t=>{const f=fold(t);return terms.every(x=>f.includes(x))};
  const g={setores:[],pastas:[],docs:[],inds:[],avisos:[]};
  (S.pastas||[]).forEach(p=>{if(has(p.nome)){const s=setorById(p.setorId);g.pastas.push({k:'pasta',id:p.id,t:p.nome,sub:(s?s.nome:'')+(p.paiId?' / '+pastaNomeCompleto(p.paiId):'')})}});
  S.setores.forEach(s=>{if(has(s.nome+' '+(s.descricao||'')))g.setores.push({k:'setor',id:s.id,t:s.nome,sub:s.descricao?snippet(s.descricao,terms):'Setor'})});
  S.docs.forEach(d=>{const corpo=d.tipo==='texto'?(d.texto||''):d.tipo==='planilha'?Object.values((d.planilha||{}).celulas||{}).join(' · '):(d.arquivo||{}).nome||'';
    if(has(d.titulo+' '+corpo)){const s=setorById(d.setorId);const sn=snippet(corpo,terms);g.docs.push({k:'doc',id:d.id,t:d.titulo,tipo:d.tipo,sub:(s?s.nome:'')+(d.pastaId&&pastaById(d.pastaId)?' / '+pastaNomeCompleto(d.pastaId):'')+(sn?' · '+sn:'')})}});
  S.inds.forEach(i=>{if(has(i.nome)){const s=setorById(i.setorId);g.inds.push({k:i.docId?'doc':'setor',id:i.docId||i.setorId,t:i.nome,sub:`${indDisplay(i).txt}${i.unidade?' '+i.unidade:''} · ${s?s.nome:''}`})}});
  (S.avisos||[]).forEach(v=>{if(has(v.titulo+' '+(v.texto||'')))g.avisos.push({k:'aviso',id:v.id,t:v.titulo,sub:snippet(v.texto,terms)||rel(v.quando)})});
  return{g,terms}}
function renderBusca(){const box=$('#busRes');if(!box)return;const r=buscar(S.q||'');const inp=$('#busca');
  if(!r||document.activeElement!==inp&&!box.contains(document.activeElement)){box.hidden=true;box.innerHTML='';return}
  const sec=[['setores','Setores'],['pastas','Pastas'],['docs','Documentos, planilhas e anexos'],['inds','Indicadores'],['avisos','Avisos']];let n=0;
  const html=sec.map(([k,l])=>{const list=r.g[k];if(!list.length)return'';return`<div class="sr-h">${l}</div>`+list.slice(0,8).map(it=>{n++;
    return`<button class="sr-i" data-act="busGo" data-k="${it.k}" data-id="${esc(it.id)}">${it.tipo?`<span class="tp ${esc(it.tipo)}">${{texto:'TEXTO',planilha:'PLANILHA',arquivo:'ANEXO'}[it.tipo]}</span>`:''}<span style="min-width:0"><span class="sr-t">${marcar(it.t,r.terms)}</span>${it.sub?`<span class="sr-s">${marcar(it.sub,r.terms)}</span>`:''}</span></button>`}).join('')}).join('');
  let sp='';const sb=S.spBusca;if(S.mcp&&sb&&sb.q===(S.q||'').trim()){sp=`<div class="sr-h">SharePoint</div>`+(sb.carregando?'<p class="sr-vazio">Buscando no SharePoint...</p>':sb.erro?`<p class="sr-vazio">${esc(spErro(sb.erro))}</p>`:sb.itens.length?sb.itens.map(it=>{n++;return`<button class="sr-i" data-act="busGo" data-k="sp" data-id="${esc(it.uri)}" data-nome="${esc(it.name)}" data-web="${esc(spWebOk(it.webUrl)?it.webUrl:'')}"><span class="tp sp">${esc((it.name.split('.').pop()||'').slice(0,4).toUpperCase())}</span><span style="min-width:0"><span class="sr-t">${marcar(it.name,r.terms)}</span><span class="sr-s">${esc(spCaminho(it.webUrl)||spLimpa(it.summary).slice(0,90))}</span></span></button>`}).join(''):'<p class="sr-vazio">Nada no SharePoint.</p>')}

function docParaIA(d){if(d.tipo==='texto')return{titulo:d.titulo,tipo:'texto',texto:(d.texto||'').slice(0,20000)};
  if(d.tipo==='planilha'){const cel=(d.planilha||{}).celulas||{};const out=[];for(const ref of Object.keys(cel)){const raw=cel[ref];if(raw===''||raw==null)continue;const v=displayCell(d.id,ref).txt;out.push(String(raw).startsWith('=')?`${ref}: ${raw} → ${v}`:`${ref}: ${raw}`);if(out.length>=600)break}

    {name:'abrir',description:'Abre na tela um setor (tipo "setor") ou um documento (tipo "documento") pelo id, para levar a pessoa até ele.',inputSchema:{type:'object',properties:{tipo:{type:'string',enum:['setor','documento']},id:{type:'string'}},required:['tipo','id']},
      execute:({tipo,id})=>{id=String(id||'');if(tipo==='setor'){if(!setorById(id))throw new Error('Setor não encontrado');go('setor',id)}else{if(!docById(id))throw new Error('Documento não encontrado');go('doc',id)}return'Aberto na tela.'}},
    {name:'propor_texto',description:'Sugere substituir todo o conteúdo de um documento de texto. Envie o texto final completo.',inputSchema:{type:'object',properties:{id:{type:'string'},novo_texto:{type:'string'},resumo:{type:'string'}},required:['id','novo_texto','resumo']},
      execute:({id,novo_texto,resumo})=>{const d=needDoc(id,'texto');return addProp({tipo:'texto',docId:d.id,texto:String(novo_texto||''),resumo:String(resumo||'')})}},
    {name:'propor_celulas',description:'Sugere alterar células de uma planilha. Cada alteração: celula (A1 a Z500) e valor (texto, número no formato brasileiro ou fórmula com =). Valor vazio apaga.',inputSchema:{type:'object',properties:{id:{type:'string'},alteracoes:CEL,resumo:{type:'string'}},required:['id','alteracoes','resumo']},
      execute:({id,alteracoes,resumo})=>{const d=needDoc(id,'planilha');const alts=limparAlts(alteracoes);if(!alts.length)throw new Error('Nenhuma célula válida.');return addProp({tipo:'celulas',docId:d.id,alteracoes:alts,resumo:String(resumo||'')})}},

      execute:(a)=>{const s=setorById(String(a.setor_id||''));if(!s)throw new Error('Setor não encontrado');if(!canEditSetor(s))throw new Error('O usuário não pode editar o setor '+s.nome+'.');const tipo=a.tipo==='planilha'?'planilha':'texto';
        return addProp({tipo:'novo',tipoDoc:tipo,setorId:s.id,titulo:String(a.titulo||'Sem título').slice(0,120),texto:tipo==='texto'?String(a.texto||''):null,celulas:tipo==='planilha'?limparAlts(a.celulas):null,resumo:String(a.resumo||'')})}},

        let docId=null,celula=null;if(a.planilha_id){const d=docById(String(a.planilha_id));if(!d||d.tipo!=='planilha')throw new Error('Planilha não encontrada');const c=String(a.celula||'').toUpperCase().trim();const r=parseRef(c);if(!r||r.c>25)throw new Error('Célula inválida');docId=d.id;celula=c}

      {name:'ler_sharepoint',description:'Lê o conteúdo de um arquivo ou lista o conteúdo de uma pasta do SharePoint pelo uri (file:///...).',inputSchema:{type:'object',properties:{uri:{type:'string'}},required:['uri']},

function limparAlts(list){return(Array.isArray(list)?list:[]).map(a=>({celula:String(a&&a.celula||'').toUpperCase().replace(/\$/g,'').trim(),valor:String(a&&a.valor!=null?a.valor:'')})).filter(a=>{const p=parseRef(a.celula);return p&&p.c<26&&p.r<500}).slice(0,800)}
function sampleErr(c){return({rate_limited:'Muitas perguntas seguidas ou limite de uso da sua conta atingido. Tente de novo em alguns minutos.',session_expired:'Sua sessão expirou. Entre de novo no claude.ai.',refused:'O Claude não respondeu a este pedido. Tente reformular.',prompt_too_large:'A conversa ficou grande demais. Clique em Nova conversa.',empty_completion:'O Claude não produziu resposta. Tente reformular.',not_granted:'Você não permitiu que o portal usasse o Claude.',sampling_disabled:'O Claude não está disponível para sua conta aqui.'})[c]||'Não foi possível obter a resposta. Tente de novo.'}
async function enviarChat(texto){texto=String(texto||'').trim();if(S.busy||!texto||!S.sample)return;
  S.botDraft='';S.chat.push({role:'user',content:texto});const i=S.chat.length;S.chat.push({role:'assistant',content:'',pending:true,status:'Pensando...'});S.busy=true;renderBot();
  const ctl=new AbortController();S.ctl=ctl;const m=S.chat[i];
  const turns=S.chat.slice(0,i).filter(x=>x.content).slice(-12).map(x=>({role:x.role,content:x.content}));
  const input=[{role:'user',content:regras()},...turns];
  try{const opts={signal:ctl.signal,cache:false,onText:({text})=>{m.content=text;m.status='';updateBubble(i)}};if(S.toolsOk)opts.tools=ferramentas(i);
    const r=await S.sample(input,opts);m.content=r.text;if(r.truncated)m.erro='A resposta foi cortada. Peça algo menor por vez.'}
  catch(e){m.content=e.text||'';m.erro=e.code==='cancelled'?'Interrompido.':sampleErr(e.code);
    if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(e.code))S.sampleOff=true;if(e.code==='tools_unavailable')S.toolsOk=false}
  finally{m.pending=false;S.busy=false;S.ctl=null;renderBot();const b=$('#chatBox');if(b)b.focus()}}
async function aplicarProp(p){if(!p||p.status!=='pendente')return;const t=nowISO();let ok=false;
  if(p.docId&&S.edit&&S.edit.docId===p.docId&&S.edit.dirty&&(p.tipo==='texto'||p.tipo==='celulas')){toast('Salve ou descarte suas alterações nesse item antes de aplicar.','err');return}
  if(p.tipo==='texto'){const d=docById(p.docId);if(!d||!canEditDoc(d))return toast('Você não pode editar este documento.','err');
    ok=await W(()=>S.db.doc('docs/'+d.id).set({...strip(d),texto:p.texto,atualizadoPor:S.me.id,atualizadoEm:t}),'Aplicado');if(ok)logA('editou (com o Claude) o documento',d.setorId,d.titulo,d.id)}
  else if(p.tipo==='celulas'){const d=docById(p.docId);if(!d||!canEditDoc(d))return toast('Você não pode editar esta planilha.','err');
    const pl=clone(d.planilha||{colunas:6,linhas:15,celulas:{}});pl.celulas=pl.celulas||{};aplicarAlts(pl,p.alteracoes);
    ok=await W(()=>S.db.doc('docs/'+d.id).set({...strip(d),planilha:pl,atualizadoPor:S.me.id,atualizadoEm:t}),'Aplicado');if(ok)logA('editou (com o Claude) a planilha',d.setorId,d.titulo,d.id)}
  else if(p.tipo==='novo'){const s=setorById(p.setorId);if(!canEditSetor(s))return toast('Você não pode editar este setor.','err');
    let extra;if(p.tipoDoc==='planilha'){const pl={colunas:6,linhas:15,celulas:{}};aplicarAlts(pl,p.celulas||[]);extra={planilha:pl}}else extra={texto:p.texto||''};
    const id=await criarDoc(s.id,p.tipoDoc,p.titulo,extra);ok=!!id;if(ok){toast('Criado em '+s.nome);go('doc',id,true)}}
  else if(p.tipo==='ind'){const s=setorById(p.setorId);if(!canEditSetor(s))return toast('Você não pode editar este setor.','err');
    if(!p.indId&&S.inds.some(i=>norm(i.nome)===norm(p.nome)))return toast('Já existe um indicador com esse nome.','err');
    const n=p.docId?null:parseNum(p.valor);const id=p.indId||('ind-'+Date.now().toString(36));

  else if(p.tipo==='indDel'){const i=S.inds.find(x=>x.id===p.indId);if(!i)return;ok=await W(()=>S.db.doc('indicadores/'+i.id).delete(),'Indicador removido');if(ok)logA('removeu o indicador',i.setorId,i.nome)}
  else if(p.tipo==='pedido'){ok=await criarPedido(p.texto)}
  else if(p.tipo==='pedStatus'){ok=await W(()=>S.db.doc('pedidos/'+p.pedidoId).update({status:p.status}),'Pedido atualizado')}
  if(ok){p.status='aplicada';renderBot()}}
function aplicarAlts(pl,alts){for(const a of alts){const r=parseRef(a.celula);if(!r||r.c>25)continue;if(a.valor==='')delete pl.celulas[a.celula];else pl.celulas[a.celula]=a.valor;pl.colunas=Math.max(pl.colunas||6,r.c+1);pl.linhas=Math.max(pl.linhas||15,r.r+1)}}
async function criarPedido(texto){texto=String(texto||'').trim();if(!texto)return false;const ok=await W(()=>S.db.collection('pedidos').add({texto,userId:S.me.id,quando:nowISO(),status:'aberto'}),'Pedido registrado');if(ok)logA('enviou um pedido ao Claude',null,texto.slice(0,60));return ok}

async function criarDoc(setorId,tipo,titulo,extra){const ref=S.db.collection('docs').doc();const t=nowISO();

  const ok=await W(()=>ref.set(body));if(!ok)return null;logA({texto:'criou o documento',planilha:'criou a planilha',arquivo:'anexou o arquivo'}[tipo],setorId,titulo,ref.id);return ref.id}

function sheetMatrix(docId,pl){let maxR=-1,maxC=-1;for(const ref of Object.keys(pl.celulas||{})){if(pl.celulas[ref]===''||pl.celulas[ref]==null)continue;const r=parseRef(ref);if(!r)continue;maxR=Math.max(maxR,r.r);maxC=Math.max(maxC,r.c)}
  const out=[];for(let r=0;r<=maxR;r++){const row=[];for(let c=0;c<=maxC;c++){const ref=refStr(c,r);const raw=pl.celulas[ref];if(raw==null||raw===''){row.push('');continue}try{row.push(cellVal(docId,ref,new Set()))}catch(e){row.push(e.code||'#ERRO')}}out.push(row)}return out}

async function toB64(buf){const b=new Uint8Array(buf);let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)}
const NATIVO={pdf:'application/pdf',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp',mp4:'video/mp4',webm:'video/webm',csv:'text/csv',md:'text/markdown',json:'application/json',txt:'text/plain'};
const BAIXAVEL=new Set('gif png jpg jpeg webp mp4 webm txt json md docx pptx csv svg pdf xlsx zip epub'.split(' '));
const ENV='PORTAL-ARQUIVO-1';
async function enviarArquivo(file,setorId){const ext=(file.name.split('.').pop()||'').toLowerCase();
  if(!BAIXAVEL.has(ext))return toast('O formato .'+ext+' não é aceito. Salve como PDF, .docx, .xlsx, .pptx, imagem, CSV ou compacte em .zip.','err');
  if(file.size>14.5*1048576)return toast('Arquivo grande demais (máximo de cerca de 14 MB). Compacte ou divida o arquivo.','err');
  if(!file.size)return toast('O arquivo está vazio.','err');
  toast('Enviando “'+file.name+'”...');
  let res=null,envelope=false;const mime=NATIVO[ext];
  const asEnvelope=async()=>{const b64=await toB64(await file.arrayBuffer());envelope=true;return S.assets.upload(new Blob([ENV+'\n'+(file.type||'application/octet-stream')+'\n'+b64],{type:'text/plain'}),{type:'text/plain'})};
  try{if(mime){try{res=await S.assets.upload(file,{type:mime})}catch(e){if(e&&(e.code==='invalid_request'||e.code==='unsupported_type'))res=await asEnvelope();else throw e}}else res=await asEnvelope()}
  catch(e){const c=e&&e.code;toast(c==='quota_or_state'?'O espaço de arquivos do app está cheio.':c==='too_large'?'Arquivo grande demais.':c==='not_granted'?'Seu nível de acesso não permite enviar arquivos.':'Falha ao enviar ('+(c||'erro')+').','err');return}
  const id=await criarDoc(setorId,'arquivo',file.name,{arquivo:{assetId:res.id,nome:file.name,mime:mime||file.type||'',tamanho:file.size,envelope}});if(id){toast('Arquivo anexado');go('doc',id,true)}}
async function baixarArquivo(d){const a=d.arquivo||{};try{const r=await fetch('/_blob/'+encodeURIComponent(a.assetId));if(!r.ok)throw new Error(r.status);
    if(a.envelope){const txt=await r.text();const i1=txt.indexOf('\n'),i2=txt.indexOf('\n',i1+1);if(txt.slice(0,i1)!==ENV)throw new Error('fmt');const bin=atob(txt.slice(i2+1));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);await baixar(a.nome,u)}

async function lerTexto(file){const buf=await file.arrayBuffer();try{return new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){return new TextDecoder('windows-1252').decode(buf)}}
function parseCSV(text){const first=text.split(/\r?\n/)[0]||'';const sep=(first.match(/;/g)||[]).length>=(first.match(/,/g)||[]).length?';':',';const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}else if(ch==='"')q=true;else if(ch===sep){row.push(cur);cur=''}else if(ch==='\n'){row.push(cur.replace(/\r$/,''));rows.push(row);row=[];cur=''}else cur+=ch}
  if(cur||row.length){row.push(cur);rows.push(row)}return rows}

  catch(e){return toast('Não foi possível ler esse arquivo. Confira se é um .xlsx ou .csv válido.','err')}
  const id=await criarDoc(ctx.setorId,'planilha',ctx.titulo,{planilha:{colunas:Math.max(6,maxC+1),linhas:Math.max(15,maxR+2),celulas:cel}});if(id){toast('Planilha importada');go('doc',id,true)}}

  if(e.key==='Enter'&&S.modal&&t.tagName==='INPUT'&&t.type==='text'&&!t.dataset.picker){e.preventDefault();modalOk()}});
document.addEventListener('change',async e=>{const t=e.target;
  if(t.id==='docTitle'){const d=docById(S.edit&&S.edit.docId);const v=t.value.trim();if(d&&v&&v!==d.titulo){if(await W(()=>S.db.doc('docs/'+d.id).update({titulo:v}),'Renomeado'))logA('renomeou para',d.setorId,v,d.id)}}
  if(t.id==='filePick'&&t.files[0]&&S.uploadSetor)enviarArquivo(t.files[0],S.uploadSetor);
  if(t.id==='importPick'&&t.files[0])importarPlanilha(t.files[0]);
  if(t.id==='fotoPick'&&t.files[0])enviarFoto(t.files[0])});
window.addEventListener('beforeunload',e=>{if(S.edit&&S.edit.dirty){e.preventDefault();e.returnValue=''}});

/* ---------- Início ---------- */
function onDocsChanged(){const e=S.edit;if(!e)return;const d=docById(e.docId);if(!d)return;if(d.atualizadoEm!==e.base){if(!e.dirty){loadDraft(d,e.modo)}else e.remote=true}}
function changed(){resetCalc();scheduleRender()}
function subErr(e){console.warn('db',e);if(e&&e.code==='revoked'){S.noDb=true;scheduleRender()}}
function subscribe(){const db=S.db;
  db.collection('setores').onSnapshot(q=>{S.setores=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.ordem??999)-(b.ordem??999)||String(a.nome).localeCompare(String(b.nome)));S.loaded.setores=true;changed()},subErr);
  db.collection('docs').onSnapshot(q=>{S.docs=q.docs.map(d=>({id:d.id,...d.data()}));S.loaded.docs=true;onDocsChanged();changed()},subErr);
  db.collection('pastas').onSnapshot(q=>{S.pastas=q.docs.map(d=>({id:d.id,...d.data()}));changed()},subErr);
  db.collection('indicadores').onSnapshot(q=>{S.inds=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.nome).localeCompare(String(b.nome)));changed()},subErr);
  db.collection('atividades').orderBy('quando','desc').limit(200).onSnapshot(q=>{S.ativ=q.docs.map(d=>({id:d.id,...d.data()}));renderSide();if(S.route.v==='avisos'&&!mainBusy())renderMain()},subErr);
  db.collection('avisos').orderBy('quando','desc').limit(100).onSnapshot(q=>{S.avisos=q.docs.map(d=>({id:d.id,...d.data()}));renderSide();if(S.route.v==='avisos')scheduleRender();ensureNames()},subErr);
  db.collection('pedidos').orderBy('quando','desc').limit(100).onSnapshot(q=>{S.pedidos=q.docs.map(d=>({id:d.id,...d.data()}));if(S.route.v==='admin')scheduleRender()},subErr);
  db.collection('conversas').onSnapshot(q=>{S.convs=q.docs.map(d=>({id:d.id,...d.data()}));renderSide();if(S.route.v==='conversas'){updateConversas();marcarLido()}ensureNames()},subErr);
  db.collection('perfis').onSnapshot(q=>{const m={};q.docs.forEach(d=>{m[d.id]=d.data()});S.perfis=m;renderSide();scheduleRender()},()=>{});
  if(S.me.id)db.doc('data/users/'+S.me.id+'/prefs').onSnapshot(d=>{if(!prefsBusy&&d.exists){const x=d.data();S.prefs={fixados:[...(x.fixados||[])],notif:{...(x.notif||{})}};renderSide();scheduleRender()}},()=>{});
  if(S.me.id)db.doc('data/users/'+S.me.id+'/leitura').onSnapshot(d=>{if(!lidoBusy){S.lido=d.exists?{...d.data()}:{};renderSide();if(S.route.v==='conversas')updateConversas()}},()=>{})}
(async()=>{applyTheme();render(true);renderBot();const C=window.claude;const use=n=>C&&C.use?C.use(n).catch(()=>null):Promise.resolve(null);
  const [db,user,sample,assets,downloads,mcp]=await Promise.all(['db','user','sample','assets','downloads','mcp'].map(use));
  Object.assign(S,{db,user,sample,assets,downloads,mcp});
  if(user){try{const me=await user.me();S.me.id=me.id;S.me.isAdmin=!!me.canEdit;S.me.name=me.name||'';S.me.email=me.email||'';S.me.avatar=me.avatarUrl||'';if(me.id)S.names[me.id]={name:me.name,avatarUrl:me.avatarUrl};S.me.canWrite=await user.can('data.write')}catch(e){}}
  if(sample){try{const l=await sample.limits();S.toolsOk=!!(l&&l.tools)}catch(e){S.toolsOk=false}}
  if(!db){S.noDb=true;S.loaded.setores=true;S.loaded.docs=true;render(true);renderBot();return}
  subscribe();render(true);renderBot()})();
</script>
